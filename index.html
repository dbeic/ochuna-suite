<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ochuna Software Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            color: #fff;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #a8b2d1;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
        }
        .app-grid {
            display: grid;
            gap: 14px;
            margin-bottom: 30px;
        }
        .app-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            letter-spacing: 0.3px;
        }
        .app-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(8px) scale(1.01);
            border-color: #64ffda;
            box-shadow: 0 0 25px rgba(100,255,218,0.15);
        }
        .app-btn .icon {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            background: rgba(100,255,218,0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .app-btn .badge {
            margin-left: auto;
            background: rgba(100,255,218,0.2);
            color: #64ffda;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        .back-home {
            background: rgba(255,70,70,0.15);
            border: 1px solid rgba(255,70,70,0.3);
            color: #ff6b6b;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 10px;
            font-size: 0.95rem;
            display: block;
            text-decoration: none;
        }
        .back-home:hover {
            background: rgba(255,70,70,0.25);
            transform: scale(0.98);
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            line-height: 1.6;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        .footer a {
            color: #64ffda;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .status-badge {
            display: inline-block;
            background: rgba(100,255,218,0.15);
            color: #64ffda;
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 10px;
            font-weight: 400;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.6rem; }
            .app-btn { padding: 14px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Ochuna Suite</h1>
        <div class="subtitle">
            Enterprise Software Solutions — Kenya
            <span class="status-badge">● LIVE</span>
        </div>
        
        <div class="app-grid">
            <a href="#" class="app-btn" data-app="harambee">
                <span class="icon">💰</span>
                Harambee Cash App
                <span class="badge">LAUNCH</span>
            </a>
            <a href="#" class="app-btn" data-app="mashamba">
                <span class="icon">🌾</span>
                Mashamba App
                <span class="badge">LAUNCH</span>
            </a>
            <a href="#" class="app-btn" data-app="wholesaler">
                <span class="icon">📦</span>
                Wholesaler App
                <span class="badge">LAUNCH</span>
            </a>
            <a href="#" class="app-btn" data-app="cashier">
                <span class="icon">🔍</span>
                Cashier Finder App
                <span class="badge">LAUNCH</span>
            </a>
            <a href="#" class="app-btn" data-app="groups">
                <span class="icon">🏅</span>
                Groups Badge App
                <span class="badge">LAUNCH</span>
            </a>
        </div>

        <a href="#" class="back-home" id="backHome">⬅ Back Home (Logout)</a>
        
        <div class="footer">
            <strong>Developer:</strong> James Boyid Ochuna<br>
            <a href="mailto:jamesochuna37@gmail.com">📧 jamesochuna37@gmail.com</a> &nbsp;|&nbsp; 
            <a href="tel:+254701207062">📞 +254 701207062</a>
        </div>
    </div>

    <script>
        // App URL mapping - All apps deployed on Render
        const appUrls = {
            harambee: 'https://harambee-wasl.onrender.com',
            mashamba: 'https://mashamba-wzka.onrender.com',
            wholesaler: 'https://wholesaler-nk72.onrender.com',
            cashier: 'https://cashier-finder.onrender.com',
            groups: 'https://bodabodaregister.onrender.com'
        };

        // Click handlers for app buttons
        document.querySelectorAll('.app-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const appKey = this.dataset.app;
                const url = appUrls[appKey];
                if (url && url !== '#') {
                    // Open in new tab (optional - remove target for same tab)
                    window.open(url, '_blank');
                } else {
                    alert('🔧 App not configured yet.\nContact: jamesochuna37@gmail.com');
                }
            });
        });

        // Back Home - Logout simulation
        document.getElementById('backHome').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('🔄 Logout and return to home?')) {
                // Clear session/localStorage if needed
                sessionStorage.clear();
                localStorage.clear();
                window.location.href = window.location.pathname; // Reload to home
            }
        });

        // Optional: Add animation on page load
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            setTimeout(() => {
                container.style.transition = 'all 0.6s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
